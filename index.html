<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrolly Kirk</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 16px/1.6 system-ui, sans-serif; max-width: 36rem; margin: 0 auto; padding: 3rem 16px; }
    code { background: rgba(127,127,127,.2); padding: .1em .35em; border-radius: 4px; }
    details { margin-top: 1.5rem; opacity: .8; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Scrolly Kirk</h1>
  <p>Instagram with a per-video volume bar.</p>
  <p><a id="phone" href="https://www.instagram.com/">Open Instagram (phone size)</a></p>
  <script>
    // A narrow window makes Instagram switch to its mobile layout.
    document.getElementById("phone").addEventListener("click", function (e) {
      var w = window.open(this.href, "scrollykirk", "popup=yes,width=430,height=900");
      if (w) e.preventDefault(); // if popups are blocked, the normal link still works
    });
  </script>

  <details>
    <summary>How to install</summary>
    <ol>
      <li>Get the <a href="https://github.com/nunor04/Site">repository</a> and open <code>chrome://extensions</code>.</li>
      <li>Turn on <strong>Developer mode</strong>, click <strong>Load unpacked</strong>, choose the <code>extension</code> folder.</li>
    </ol>
    <p>Desktop app: <code>npm install</code>, then <code>npm start</code>.</p>
  </details>
</body>
</html>
